[project]
name = "project-zysec"
version = "0.1.0"
description = "ZySec AI Streamlit application"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "mypy>=1.18.2",
  "pytest>=8.4.2",
  "pytest-cov>=7.0.0",
  "ruff>=0.13.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
extend-exclude = ["app.py", "modules"]

[tool.coverage.run]
source = ["src"]

[tool.mypy]
files = ["src"]
