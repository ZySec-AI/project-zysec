name: Security Scan

on:
  pull_request:
    branches: [stage, release]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: write

# This is the only Security workflow trigger. The scan implementation,
# including Gitleaks, lives in _reusable-security.yml.
jobs:
  scan:
    uses: ZySec-AI/.github/.github/workflows/_reusable-security.yml@develop
    with:
      auto_detect: true
    secrets: inherit
