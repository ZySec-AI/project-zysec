version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    # `dependencies` is in the org taxonomy (labels.yml), so it survives
    # sync-labels.yml and makes every automated bump filterable.
    labels: ["dependencies"]
    commit-message:
      prefix: "deps"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    reviewers:
      - "ZySec-AI/org-maintenance"

  - package-ecosystem: "github-actions"
    directory: ".github/workflows"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    # `dependencies` is in the org taxonomy (labels.yml), so it survives
    # sync-labels.yml and makes every automated bump filterable.
    labels: ["dependencies"]
    commit-message:
      prefix: "ci"
    groups:
      actions:
        update-types:
          - "minor"
          - "patch"
